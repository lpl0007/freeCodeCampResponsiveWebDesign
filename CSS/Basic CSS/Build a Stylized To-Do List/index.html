<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <title>Styled To-Do List</title>
        <link href="styles.css" rel="stylesheet">
    </head>
    <body>
        <ul class="todo-list">
            <li>
                <input type="checkbox" id="gaming-keyboards">
                <label for="gaming-keyboards">Explore gaming keyboards</label>
                <ul class="sub-item">
                    <li><a class="sub-item-link" href="https://www.freecodecamp.org/learn" target="_blank">Store link</a></li>
                </ul>
            </li>
            <li>
                <input type="checkbox" id="report">
                <label for="report">Finish the report</label>
                <ul class="sub-item">
                    <li><a class="sub-item-link" href="https://www.freecodecamp.org/learn" target="_blank">Request Access</a></li>
                </ul>
            </li>
            <li>
                <input type="checkbox" id="phone-warranty">
                <label for="phone-warranty">View Phone's Warranty</label>
                <ul class="sub-item">
                    <li><a class="sub-item-link" href="https://www.freecodecamp.org/learn" target="_blank">View Receipts</a></li>
                </ul>
            </li>
            <li>
                <input type="checkbox" id="check-specs">
                <label for="check-specs">Check Processor Specs</label>
                <ul class="sub-item">
                    <li><a class="sub-item-link" href="https://www.freecodecamp.org/learn" target="_blank">View Model Number</a></li>
                </ul>
            </li>
        </ul>
    </body>
</html>
