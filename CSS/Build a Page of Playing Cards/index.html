<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./styles.css">
    <title>Playing Cards</title>
  </head>
  <body>
    <main id="playing-cards">
      <div class="card">
        <div class="left">♥</div>
        <div class="middle">3</div>
        <div class="right">♥</div>
      </div>
      <div class="card">
        <div class="left">♣</div>
        <div class="middle">K</div>
        <div class="right">♣</div>
      </div>
      <div class="card">
        <div class="left">♠</div>
        <div class="middle">8</div>
        <div class="right">♠</div>
      </div>
    </main>
  </body>
</html>
