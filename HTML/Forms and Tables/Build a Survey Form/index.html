<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Survey Form</title>
  </head>
  <body>
    <header>
      <h1 id="title">freeCodeCamp Survey Form</h1>
      <p id="description">Thank you for taking the time to help us improve the platform</p>
    </header>
    <main>
      <form id="survey-form">
        <label for="name" id="name-label">Name</label>
        <input type="text" id="name" name="name" placeholder="Enter your name" required>
        <br>
        <label for="email" id="email-label">Email</label>
        <input type="email" id="email" name="email" placeholder="Enter your Email" required>
        <br>
        <label for="number" id="number-label">Age(optional)</label>
        <input type="number" id="number" name="age" placeholder="Age" min="18" max="100">
        <br><br>
        <label for="current-role">Which option best describes your current role?</label>
        <br><br>
        <select name="current-role" id="dropdown">
          <option value="default" selected>Select current role</option>
          <option value="student">Student</option>
          <option value="job">Full Time Job</option>
          <option value="learner">Full Time Learner</option>
          <option value="opt-out">Prefer not to say</option>
          <option value="other">Other</option>
        </select>
        <br><br>
        <legend>Would you recommend freeCodeCamp to a friend?</legend>
        <br>
        <input id="definitely-option" type="radio" name="recommend-radio" value="definitely">
        <label for="definitely-option">Definitely</label>
        <input id="maybe-option" type="radio" name="recommend-radio" value="maybe">
        <label for="maybe-option">Maybe</label>
        <input id="not-sure-option" type="radio" name="recommend-radio" value="not-sure">
        <label for="not-sure-option">Not sure</label>
        <br><br>
        <label for="current-role">What is your favorite feature of freeCodeCamp?</label>
        <br><br>
        <select name="current-role">
          <option value="default" selected>Select an option</option>
          <option value="challenges">Challenges</option>
          <option value="projects">Projects</option>
          <option value="community">Community</option>
          <option value="open-source">Open Source</option>
        </select>
        <br><br>
        <legend>What would you like to see improved? (Check all that apply)</legend>
        <br>
        <input type="checkbox" id="front-end" name="front-end" value="front-end">
        <label for="front-end">Front-end Projects</label>
        <input type="checkbox" id="back-end" name="back-end" value="back-end">
        <label for="back-end">Back-end Projects</label>
        <input type="checkbox" id="data-visualization" name="data-visualization" value="data-visualization">
        <label for="data-visualization">Data Visualization</label>
        <input type="checkbox" id="challenges" name="challenges" value="challenges">
        <label for="challenges">Challenges</label>
        <input type="checkbox" id="open-source" name="open-source" value="open-source">
        <label for="open-source">Open Source Community</label>
        <input type="checkbox" id="glitter" name="glitter" value="glitter">
        <label for="glitter">Glitter help rooms</label>
        <input type="checkbox" id="videos" name="videos" value="videos">
        <label for="videos">Videos</label>
        <input type="checkbox" id="meetups" name="meetups" value="meetups">
        <label for="meetups">City Meetups</label>
        <input type="checkbox" id="wiki" name="wiki" value="wiki">
        <label for="wiki">Wiki</label>
        <input type="checkbox" id="forum" name="forum" value="forum">
        <label for="forum">Forum</label>
        <input type="checkbox" id="courses" name="courses" value="courses">
        <label for="courses">Additional Courses</label>
        <br><br>
        <label for="comments">Any comments or suggestions?</label>
        <br><br>
        <textarea name="comments" id="comments" placeholder="Enter your comment here..."></textarea>
        <br>
        <button type="submit" id="submit">Submit</button>
      </form>
    </main>
  </body>
</html>
