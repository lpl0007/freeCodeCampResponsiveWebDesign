<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="styles.css" />
    <title>Product Landing Page</title>
  </head>
  <body>
    <header id="header">
      <img id="header-img" src="https://cdn.freecodecamp.org/curriculum/cat-photo-app/lasagna.jpg" alt="some lasagna">
      <nav id="nav-bar">
        <ul>
          <li><a class="nav-link" href="#features"></a></li>
          <li><a class="nav-link" href="#how-it-works"></a></li>
          <li><a class="nav-link" href="#pricing"></a></li>
        </ul>
      </nav>
    </header>
    <main>
      <div id="features"></div>
      <div id="how-it-works">
        <iframe
          src="https://www.youtube.com/embed/I0_951_MPE0"
          title="CSS"
          id="video"></iframe>
      </div>
      <div id="pricing">
        <form id="form" action="https://www.freecodecamp.org/email-submit">
          <label for="email">Enter Your Email: <input id="email" name="email" type="email" required placeholder="johndoe@gmail.com" /></label>
          <input id="submit" type="submit" value="Submit" />
        </form>
      </div>
    </main>
  </body>
</html>
